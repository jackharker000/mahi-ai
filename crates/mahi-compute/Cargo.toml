[package]
name = "mahi-compute"
description = "Inference router and providers (modes A-D) for Mahi AI."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = []
hosted = ["dep:reqwest", "dep:eventsource-stream"]

[dependencies]
mahi-contracts.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
reqwest = { workspace = true, optional = true }
eventsource-stream = { workspace = true, optional = true }

[dev-dependencies]
mahi-contracts = { workspace = true, features = ["testkit"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
