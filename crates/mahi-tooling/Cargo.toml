[package]
name = "mahi-tooling"
description = "Uniform tool contract, registry, and built-in tools for Mahi AI."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = []
# Enables the real HTTP paths of `web_fetch` / `web_search` (reqwest).
# Without this feature the web tools are still registered but report an
# honest "built without net" error; parsing helpers compile either way.
net = ["dep:reqwest"]

[dependencies]
mahi-contracts.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["process", "fs"] }
tokio-util.workspace = true
futures.workspace = true
reqwest = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = "3"
