[package]
name = "mahi-ffi"
description = "UniFFI bindings exposing the Mahi core to Swift/Kotlin."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
name = "mahi_ffi"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
mahi-contracts.workspace = true
mahi-agent-core.workspace = true
mahi-data.workspace = true
# Real hosted providers (Anthropic/OpenAI-compatible) and the managed local
# llama.cpp runtime are both linked into the app via this FFI.
mahi-compute = { workspace = true, features = ["hosted", "local-llm"] }
mahi-tooling.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
tokio-util.workspace = true
futures.workspace = true
uuid.workspace = true
thiserror.workspace = true
uniffi = { version = "0.28", features = ["cli"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
