[workspace]
resolver = "2"
members = [
    "crates/mahi-contracts",
    "crates/mahi-data",
    "crates/mahi-compute",
    "crates/mahi-agent-core",
    "crates/mahi-tooling",
    "crates/mahi-connectivity",
    "crates/mahi-ffi",
    "bins/mahi-cli",
    "bins/mahi-daemon",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
rust-version = "1.82"
repository = "https://github.com/jackharker000/mahi-ai"

[workspace.dependencies]
# Async runtime + streaming
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time", "net"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors + logging
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Primitives
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
base64 = "0.22"

# Storage (mahi-data)
rusqlite = { version = "0.32", features = ["bundled"] }

# Crypto (mahi-data)
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
zeroize = "1"
rand = "0.8"

# HTTP (mahi-compute hosted providers, mahi-daemon)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
axum = "0.7"
eventsource-stream = "0.2"

# CLI
clap = { version = "4", features = ["derive"] }

# Internal crates
mahi-contracts = { path = "crates/mahi-contracts" }
mahi-data = { path = "crates/mahi-data" }
mahi-compute = { path = "crates/mahi-compute" }
mahi-agent-core = { path = "crates/mahi-agent-core" }
mahi-tooling = { path = "crates/mahi-tooling" }
mahi-connectivity = { path = "crates/mahi-connectivity" }

[profile.release]
opt-level = 3
lto = "thin"
