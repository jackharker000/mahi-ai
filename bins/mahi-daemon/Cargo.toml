[package]
name = "mahi-daemon"
description = "Mahi home-server daemon (Mac inference + task host)."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "mahi-daemon"
path = "src/main.rs"

[features]
default = []
# Enable hosted providers (Anthropic / OpenAI-compatible) for mode D.
hosted = ["mahi-compute/hosted"]

[dependencies]
mahi-contracts.workspace = true
mahi-compute.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal"] }
tokio-util.workspace = true
axum.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
