[package]
name = "mahi-daemon"
description = "Mahi home-server daemon (Mac inference + task host)."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "mahi-daemon"
path = "src/main.rs"

[dependencies]
